name: CI

# Blocking checks for both Next.js apps in this repo (main app + admin
# console). Both apps share one Postgres schema but have independent
# package.json/lockfiles, so they're verified as separate jobs that can
# run in parallel.
#
# DATABASE_URL below is a placeholder, never a real credential: both apps'
# "prisma generate" (Prisma 7's prisma.config.ts, see prisma.config.ts /
# admin/prisma.config.ts) requires the env var to resolve to *some* string
# at config-load time, but generate never actually connects -- it just
# reads prisma/schema.prisma and emits the typed client. Neither test
# suite opens a real database connection (verified: no test file calls
# db.* / prisma.* -- see tests/ and admin/tests/), so no live database is
# needed here at all.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
  # Node 22, not 20: pinned here deliberately. Diagnosed 2026-10-09
  # after both jobs failed in CI with node-version: '20', while
  # everything was green locally under Node 22 -- two independent,
  # fully reproduced causes, neither of them our app code:
  #   1. Admin's "prisma generate" step: prisma@7.10.0's CLI
  #      transitively requires @prisma/dev, which require()s the
  #      ESM-only `zeptomatch` package -- only works on a Node version
  #      with require(esm) support on by default (true for Node 22,
  #      not for Node 20.18.1, which reproduces ERR_REQUIRE_ESM).
  #   2. Main app's "Test" step: `tsx --test tests/**/*.test.ts` needs
  #      Node's own test runner to resolve that `**` glob itself (npm's
  #      script shell is dash here, which doesn't expand `**`) -- that
  #      resolution silently fails ("Could not find
  #      '.../tests/**/*.test.ts'") on Node 20.18.1, works on 22.23.2.
  # package.json's engines field only requires ">=20"; CI pins higher
  # than that floor on purpose.
  NODE_VERSION: '22'

jobs:
  main-app:
    name: Main app (typecheck, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # postinstall runs `prisma generate` automatically.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Informational only for now: this app has a large pre-existing lint
      # backlog (mostly react/no-unescaped-entities) that predates ESLint
      # even being wired up here, and that backlog is being worked down
      # separately rather than blocking every PR on it. Flip this to
      # blocking once that backlog is cleared.
      - name: Lint (non-blocking -- see comment above)
        run: npm run lint
        continue-on-error: true

  admin-app:
    name: Admin app (typecheck, test, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      # prisma/schema.prisma (shared, lives at the repo root) declares two
      # generator blocks -- "client" for the root app, "adminClient" for
      # this one (see that file). Confirmed by reproducing in an isolated
      # clone: `prisma generate` resolves @prisma/client relative to the
      # SCHEMA FILE's location, not the CWD, and not per-generator even
      # when scoped with --generator -- so admin's own @prisma/client
      # being installed in admin/node_modules is not enough on its own.
      # Without the root app's node_modules/@prisma/client present too,
      # generate fails outright with "Could not resolve @prisma/client",
      # which is what actually failed here before this fix (a separate,
      # unrelated bug from the Node-20 issue fixed earlier -- that one
      # crashed before ever reaching this check, which is why both looked
      # like a single failure until Node 22 was in place to see past it).
      # There's no way to generate admin's client in true isolation from
      # the root app's node_modules given how this schema is structured,
      # so this job installs the root app's dependencies too, not just
      # admin's.
      - name: Install root app dependencies (needed for prisma generate -- see comment above)
        working-directory: .
        run: npm ci

      # No postinstall hook here -- generate explicitly against the root
      # app's schema (admin/prisma.config.ts points one directory up).
      - run: npm ci
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Blocking: the admin app's lint backlog was cleared out this
      # engagement (0 errors / 0 warnings), so a new finding here is a
      # real regression, not noise.
      - name: Lint
        run: npm run lint
